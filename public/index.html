<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | ARP نظام ادارة الكترونيات</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  </script>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">🛒</div>
      <h1>ARP نظام ادارة الكترونيات</h1>
      <div class="sub">نظام إدارة المبيعات والمخزون والصيانة للإلكترونيات</div>
      <div class="error-msg" id="errorMsg"></div>
      <form id="loginForm">
        <div class="form-group">
          <label>اسم المستخدم</label>
          <input type="text" id="username" placeholder="أدخل اسم المستخدم" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <div class="password-wrap">
            <input type="password" id="password" placeholder="أدخل كلمة المرور" autocomplete="current-password" required>
            <button type="button" class="password-toggle" id="togglePass" tabindex="-1" title="إظهار/إخفاء كلمة المرور" aria-label="إظهار/إخفاء كلمة المرور"></button>
          </div>
        </div>
        <button type="submit" class="btn btn-lg btn-block" id="loginBtn">تسجيل الدخول</button>
      </form>
      <div class="hint">المستخدم الافتراضي: admin — كلمة المرور: admin123</div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
