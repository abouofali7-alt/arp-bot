<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفعيل البرنامج — ARP</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 55%, #134e4a 100%); padding: 16px; }
  .card { width: 100%; max-width: 460px; background: #fff; border-radius: 20px; padding: 34px 30px;
    box-shadow: 0 25px 60px rgba(0,0,0,.45); }
  .logo { text-align: center; margin-bottom: 6px; font-size: 44px; }
  h1 { text-align: center; color: #0f172a; font-size: 22px; margin-bottom: 4px; }
  .sub { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 24px; }
  .box { background: #f1f5f9; border: 1px dashed #cbd5e1; border-radius: 12px; padding: 14px; text-align: center; margin-bottom: 18px; }
  .box .lbl { font-size: 12px; color: #64748b; margin-bottom: 6px; }
  .box .code { font-family: 'Courier New', monospace; font-size: 26px; font-weight: bold; letter-spacing: 4px;
    color: #0f766e; direction: ltr; user-select: all; }
  .copy-btn { margin-top: 8px; background: #0f766e; color: #fff; border: 0; border-radius: 8px;
    padding: 7px 18px; cursor: pointer; font-size: 12px; }
  .copy-btn:hover { background: #115e59; }
  label { display: block; font-size: 13px; color: #334155; font-weight: 600; margin-bottom: 6px; }
  input[type=text] { width: 100%; border: 2px solid #e2e8f0; border-radius: 10px; padding: 12px 14px;
    font-size: 17px; letter-spacing: 3px; direction: ltr; text-align: center; outline: none; transition: border .2s; }
  input[type=text]:focus { border-color: #0f766e; }
  .btn { width: 100%; border: 0; border-radius: 10px; padding: 13px; font-size: 15px; font-weight: bold;
    cursor: pointer; margin-top: 12px; transition: transform .1s, opacity .2s; }
  .btn:active { transform: scale(.98); }
  .btn-main { background: #0f766e; color: #fff; }
  .btn-main:hover { background: #115e59; }
  .btn-ghost { background: transparent; color: #0f766e; border: 2px solid #99f6e4; }
  .btn-ghost:hover { background: #f0fdfa; }
  .msg { min-height: 20px; text-align: center; font-size: 13px; margin-top: 12px; font-weight: 600; }
  .msg.err { color: #dc2626; } .msg.ok { color: #16a34a; } .msg.info { color: #0f766e; }
  .divider { display: flex; align-items: center; gap: 10px; color: #94a3b8; font-size: 12px; margin: 16px 0 4px; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }
  .hidden { display: none; }
  .trial-left { background: #fefce8; border: 1px solid #fde047; color: #854d0e; border-radius: 10px;
    padding: 10px; text-align: center; font-size: 13px; font-weight: 600; margin-bottom: 14px; }
  .foot { text-align: center; color: #94a3b8; font-size: 11px; margin-top: 18px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🧾</div>
    <h1>ARP نظام ادارة الكترونيات</h1>
    <div class="sub">تفعيل البرنامج — كود التفعيل مرتبط بهذا الجهاز فقط</div>

    <div id="trialBox" class="trial-box hidden"><div id="trialInfo" class="trial-left"></div></div>

    <div class="box">
      <div class="lbl">كود هذا الجهاز — أرسله لمزوّد البرنامج لاستلام كود التفعيل</div>
      <div class="code" id="devCode">جارِ التحميل…</div>
      <button class="copy-btn" onclick="copyDev()">📋 نسخ الكود</button>
    </div>

    <label>كود التفعيل</label>
    <input type="text" id="actCode" placeholder="XXXXX-XXXXX-XXXXX" autocomplete="off" spellcheck="false">
    <button class="btn btn-main" onclick="activate()">🔑 تفعيل البرنامج</button>

    <div class="divider">أو</div>
    <div id="startTrialWrap">
      <button class="btn btn-ghost" id="trialBtn" onclick="startTrial()">⏱️ ابدأ التجربة المجانية (7 أيام)</button>
    </div>

    <div class="msg" id="msg"></div>
    <div class="foot">للحصول على كود التفعيل تواصل مع مزوّد الخدمة وأرسل له كود الجهاز أعلاه</div>
  </div>

<script>
const msg = (t, cls) => { const m = document.getElementById('msg'); m.textContent = t || ''; m.className = 'msg ' + (cls || ''); };
let STATUS = null;

async function boot() {
  try {
    STATUS = await fetch('/api/license/status').then(r => r.json());
  } catch (e) { msg('تعذر الاتصال بالخادم', 'err'); return; }
  document.getElementById('devCode').textContent = STATUS.device_code || '—';
  if (STATUS.mode === 'active') {
    document.getElementById('startTrialWrap').classList.add('hidden');
    document.getElementById('trialBox').classList.remove('hidden');
    document.getElementById('trialInfo').style.cssText = 'background:#f0fdf4;border-color:#86efac;color:#166534';
    document.getElementById('trialInfo').textContent = '✅ البرنامج مُفعّل بنجاح — جارِ فتح النظام…';
    setTimeout(() => location.href = '/', 900);
    return;
  }
  if (STATUS.mode === 'trial') {
    const d = STATUS.trial_days_left;
    document.getElementById('trialBox').classList.remove('hidden');
    document.getElementById('trialInfo').textContent = `⏱️ التجربة المجانية شغالة — متبقٍ ${d} ${d === 1 ? 'يوم' : 'أيام'}`;
    document.getElementById('startTrialWrap').classList.add('hidden');
    msg(`البرنامج يعمل في وضع التجربة — يمكنك المتابعة أو التفعيل الآن`, 'info');
    setTimeout(() => location.href = '/', 2500);
  } else if (STATUS.mode === 'expired') {
    document.getElementById('trialBox').classList.remove('hidden');
    document.getElementById('trialInfo').style.cssText = 'background:#fef2f2;border-color:#fca5a5;color:#991b1b';
    document.getElementById('trialInfo').textContent = '⛔ انتهت فترة التجربة المجانية — أدخل كود التفعيل للمتابعة';
    document.getElementById('startTrialWrap').classList.add('hidden');
  }
}

async function startTrial() {
  msg('', '');
  try {
    const r = await fetch('/api/license/trial', { method: 'POST' }).then(x => x.json());
    if (r.mode === 'trial') {
      msg('بدأت التجربة المجانية — جارِ فتح النظام…', 'ok');
      setTimeout(() => location.href = '/', 800);
    } else boot();
  } catch (e) { msg('حدث خطأ — حاول مرة أخرى', 'err'); }
}

async function activate() {
  const code = document.getElementById('actCode').value.trim();
  if (!code) { msg('أدخل كود التفعيل أولاً', 'err'); return; }
  try {
    const res = await fetch('/api/license/activate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code }),
    });
    const j = await res.json().catch(() => ({}));
    if (res.ok && j.ok) {
      msg('تم التفعيل بنجاح! جارِ فتح النظام…', 'ok');
      setTimeout(() => location.href = '/', 800);
    } else {
      msg(j.error || 'كود غير صحيح — تأكد من كتابته كما استلمته', 'err');
    }
  } catch (e) { msg('حدث خطأ — حاول مرة أخرى', 'err'); }
}

function copyDev() {
  const c = document.getElementById('devCode').textContent.trim();
  navigator.clipboard.writeText(c).then(() => msg('تم نسخ كود الجهاز ✓', 'ok')).catch(() => {});
}

document.getElementById('actCode').addEventListener('keydown', e => { if (e.key === 'Enter') activate(); });
boot();
setInterval(boot, 5000);
</script>
</body>
</html>
